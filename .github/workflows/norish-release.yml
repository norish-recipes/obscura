# Builds upstream Obscura's render+stealth release with the patches in patches/ on top, for
# Norish's image (norish-recipes/norish, docker/obscura). See README.md.
name: Norish release

on:
  # Daily: publishes each new upstream release, and a REVISION bump, within a day.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      upstream:
        description: Upstream tag to build, such as v0.2.4 (default the latest release)
        required: false
      publish:
        description: Publish the release (off builds and tests only)
        type: boolean
        default: true
  # A change to the patches or this workflow is built and tested, never published.
  push:
    branches: [norish]

permissions:
  contents: read

concurrency:
  group: norish-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: h4ckf0r0day/obscura

jobs:
  plan:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      issues: write
    outputs:
      upstream: ${{ steps.plan.outputs.upstream }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - id: plan
        name: Pick the upstream release and whether to build it
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_UPSTREAM: ${{ inputs.upstream }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          upstream="${INPUT_UPSTREAM:-$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)}"
          tag="${upstream}-norish.$(cat REVISION)"
          exists=false
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exists=true
          build=true
          publish=false
          case "$EVENT" in
            schedule) [ "$exists" = false ] && publish=true || build=false ;;
            workflow_dispatch) [ "$INPUT_PUBLISH" = true ] && [ "$exists" = false ] && publish=true ;;
          esac
          printf 'upstream=%s\ntag=%s\nbuild=%s\npublish=%s\n' "$upstream" "$tag" "$build" "$publish" >> "$GITHUB_OUTPUT"
          echo "Upstream $upstream, release $tag (exists: $exists), build: $build, publish: $publish"

      - name: Check the patches still apply
        if: steps.plan.outputs.build == 'true'
        env:
          UPSTREAM: ${{ steps.plan.outputs.upstream }}
        run: ./apply-patches.sh "$UPSTREAM" src

      - name: Open an issue when they don't
        if: failure() && steps.plan.outputs.build == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ steps.plan.outputs.upstream }}
        run: |
          title="Patches no longer apply to $UPSTREAM"
          gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq length | grep -qx 0 || exit 0
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" \
            --body "The scheduled build stopped at \`apply-patches.sh $UPSTREAM\`: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Rebase patches/ onto $UPSTREAM, bump REVISION if the result differs, and push."

      # GitHub stops the schedule of a public repo after 60 days without activity.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt $(( 45 * 86400 )) ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep the release schedule alive"
          git push origin HEAD:norish

  test:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Apply the patches
        env:
          UPSTREAM: ${{ needs.plan.outputs.upstream }}
        run: ./apply-patches.sh "$UPSTREAM" src

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install stealth build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev

      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: nextest

      # As upstream's CI runs them: one process per test, under the default SSRF policy, and the
      # gzip fixture alone allowed onto loopback. The patches' own fixtures allow it per client.
      - name: Test what the patches touch
        working-directory: src
        run: |
          cargo nextest run -p obscura-net --features stealth --no-fail-fast -- --skip stealth_client_decodes_gzip_response
          OBSCURA_ALLOW_PRIVATE_NETWORK=1 cargo nextest run -p obscura-net --features stealth stealth_client_decodes_gzip_response
          cargo nextest run -p obscura-cdp --no-fail-fast domains::network

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the binaries on glibc 2.35, as upstream's release does. Both native: the
          # V8 snapshot obscura-js bakes in only works on the architecture that built it.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Apply the patches
        env:
          UPSTREAM: ${{ needs.plan.outputs.upstream }}
        run: ./apply-patches.sh "$UPSTREAM" src

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install stealth build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev

      - name: Build the render+stealth binaries
        working-directory: src
        run: cargo build --profile release-dist --target ${{ matrix.target }} -p obscura-cli --bins --features render,stealth

      - name: Smoke test and pack them as upstream names the archive
        working-directory: src
        run: |
          mkdir -p dist/stealth
          cp target/${{ matrix.target }}/release-dist/obscura target/${{ matrix.target }}/release-dist/obscura-worker dist/stealth/
          dist/stealth/obscura fetch "data:text/html,<title>ok</title>" --eval "1+1"
          tar czf obscura-${{ matrix.arch }}-linux-stealth.tar.gz -C dist/stealth obscura obscura-worker

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obscura-${{ matrix.arch }}-linux-stealth
          path: src/obscura-${{ matrix.arch }}-linux-stealth.tar.gz
          if-no-files-found: error

  release:
    needs: [plan, test, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ needs.plan.outputs.upstream }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # Tagged on this branch's commit, whose LICENSE and README the image copies; the source is
          # the upstream tag plus that commit's patches/.
          gh release create "$TAG" dist/*.tar.gz -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Upstream [$UPSTREAM](https://github.com/$UPSTREAM_REPO/releases/tag/$UPSTREAM)'s render+stealth build, with the patches in [patches/](https://github.com/$GITHUB_REPOSITORY/tree/norish/patches) applied."
